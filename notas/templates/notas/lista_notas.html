<!DOCTYPE html>
<html>
<head>
    <title>Lista de Notas</title>
</head>
<body>
    <h1>Lista de Notas por Alumno y Curso</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Alumno</th>
                <th>Curso</th>
                <th>Nota</th>
                <th>Fecha de Registro</th>
            </tr>
        </thead>
        <tbody>
            {% for nota in notas %}
            <tr>
                <td>{{ nota.alumno }}</td>
                <td>{{ nota.curso }}</td>
                <td>{{ nota.nota }}</td>
                <td>{{ nota.fecha_registro }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No hay notas registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'crear_nota' %}">Registrar nota</a>
</body>
</html>
