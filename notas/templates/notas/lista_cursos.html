<!DOCTYPE html>
<html>
<head>
    <title>Lista de Cursos</title>
</head>
<body>
    <h1>Lista de Cursos</h1>
    <ul>
        {% for curso in cursos %}
            <li>{{ curso.nombre }} ({{ curso.codigo }}) - {{ curso.creditos }} creditos</li>
        {% empty %}
            <li>No hay cursos registrados.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'crear_curso' %}">Registrar curso</a>
</body>
</html>
